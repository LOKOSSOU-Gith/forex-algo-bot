# 📈 Forex Algo Bot — Render Blueprint (Docker)
# https://render.com/docs/blueprint-spec
# 
# 1. Push ce dossier sur GitHub
# 2. Va sur https://dashboard.render.com/blueprints
# 3. Connecte ton repo GitHub
# 4. Render détecte le Dockerfile et déploie automatiquement !

services:
  # ─── Web Service: Forex Algo Bot (Docker) ──────────────────
  - type: web
    name: forex-algo-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 7860
    healthCheckPath: /
    autoDeploy: true
    # Domaine : https://forex-algo-bot.onrender.com
    # 
    # ⚠️ ATTENTION : Le plan gratuit Render s'endort après 15 min d'inactivité
    #   → Premier chargement = 30-60 secondes de cold start
    #   → Pour 24/7, upgrade vers Starter ($7/mois)
